name: Selfie
on:
  push:
    branches: ["**"]
jobs:
  selfie:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: npm ci
      - uses: diffplug/selfie-hackathon/.github/actions/selfie@main
        with:
          upload-token: ${{ secrets.SELFIE_UPLOAD_TOKEN }}
